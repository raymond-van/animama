name: Portable product validation

on:
  pull_request:
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        converted_to_draft,
        labeled,
        unlabeled,
        edited,
      ]
  # Merges to main start no run: the weekly checkpoint, a manual dispatch and
  # release callers validate main (#933).
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      cold-cache:
        description: Run full validation without restoring or saving dependency download caches
        type: boolean
        default: false
  workflow_call:
    inputs:
      full-validation:
        description: Reusable callers always require full validation; false is rejected
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # Ignore metadata edits and labels other than ci:full and ci:run without
  # cancelling a real run; PR, scheduled and manual runs never collide.
  # Reusable release callers retain their own run identity.
  group: >-
    portable-product-${{ github.workflow }}-${{
      github.workflow != 'Portable product validation' && format('release-{0}', github.run_id) ||
      github.event_name == 'pull_request' &&
      (github.event.pull_request.state != 'open' || github.event.action == 'edited' && !github.event.changes.base ||
       (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
       github.event.label.name != 'ci:full' && github.event.label.name != 'ci:run') &&
      format('ignored-{0}', github.run_id) ||
      github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) ||
      format('{0}-{1}', github.event_name, github.ref)
    }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validation:
    name: Validation
    # A fork's PR always runs; GitHub holds each run for the owner's approval.
    # A same-repository PR runs only with ci:run (the ordinary selected
    # profile) or ci:full (every suite), because its author validates locally
    # (#933). Selection reads only ci:full and the draft flag, and only these
    # two labels decide whether the job runs, so other label changes cannot
    # change the outcome. A deleted fork has no head repository and still runs.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       (github.event.pull_request.head.repo.full_name != github.repository ||
        contains(github.event.pull_request.labels.*.name, 'ci:run') ||
        contains(github.event.pull_request.labels.*.name, 'ci:full')) &&
       (github.event.action != 'edited' || github.event.changes.base) &&
       (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
        github.event.label.name == 'ci:full' || github.event.label.name == 'ci:run'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UV_NO_SYNC: "1"
      ANIMAMA_RUN_LIVE_TESTS: "0"
    steps:
      # Setup: one candidate checkout; exact baseline checkout happens only for packaging.
      # Ordinary PR runs may record a `selective` mode that
      # skips the promotion suite and unchanged browser groups, or a routed
      # `backend-only`/`frontend-only` mode that also skips the other side's checks.
      - name: Check out exact candidate without asset hydration
        id: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          lfs: false
          persist-credentials: false
      - name: Test validation policy and evidence helpers
        id: ci-policy-tests
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" ci-policy-tests -- python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Select the source-bound validation profile
        id: select
        env:
          CI_READ_TOKEN: ${{ github.token }}
          CI_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/ci/validation.py plan --output "$RUNNER_TEMP/selection.json"
      - name: Hydrate assets required by full validation
        id: hydrate
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        env:
          CI_READ_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" hydrate -- python3 scripts/ci/validation.py hydrate
      - name: Set up locked Python toolchain and download cache
        id: uv
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","docs","backend","web"]'), steps.select.outputs.mode)
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.11.28"
          python-version: "3.12.13"
          enable-cache: ${{ !inputs.cold-cache }}
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            scripts/package-sets/build-constraints.txt
          cache-suffix: p96-uv0.11.28-python3.12.13-${{ runner.os }}-${{ runner.arch }}
      - name: Install frozen backend dependencies
        id: uv-sync
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","docs","backend","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" uv-sync -- uv sync --frozen --python 3.12.13 --extra documents
      - name: Ensure the typed-content audit prerequisite exists
        id: rg-setup
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","docs","backend","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" rg-setup -- bash -e -o pipefail -c 'if ! command -v rg; then sudo apt-get update; sudo apt-get install --yes ripgrep; fi'
      - name: Set up Node for frontend validation
        id: node
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","web"]'), steps.select.outputs.mode)
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Install the pinned package manager
        id: pnpm-setup
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" pnpm-setup -- npm install --global pnpm@10.33.0
      - name: Locate the pnpm download store
        id: pnpm-store
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" pnpm-store --cwd src/frontend -- bash -e -o pipefail -c '
          store_path=$(pnpm store path --silent)
          test -n "$store_path"
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
          '
      - name: Restore pnpm downloads without installed environments
        id: pnpm-cache
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","web"]'), steps.select.outputs.mode) && !inputs.cold-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node24.15.0-pnpm10.33.0-${{ hashFiles('src/frontend/pnpm-lock.yaml', 'src/frontend/pnpm-workspace.yaml') }}
      - name: Install frozen frontend dependencies
        id: pnpm-install
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" pnpm-install --cwd src/frontend -- pnpm install --frozen-lockfile
      - name: Prepare shared frontend package outputs once
        id: frontend-prepare
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" frontend-prepare --cwd src/frontend -- pnpm packages:build
      # Lint and repository invariants.
      - name: Audit typed-content boundaries
        id: audit
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","docs","backend","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" audit -- bash scripts/audit-typed-content.sh
      - name: Check backend formatting
        id: backend-format
        if: contains(fromJSON('["full","selective","backend-only","backend"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" backend-format -- uv run --no-sync ruff format --check src/backend/animama tests
      - name: Lint Python source and tooling
        id: backend-lint
        if: contains(fromJSON('["full","selective","backend-only","backend"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" backend-lint -- uv run --no-sync ruff check
      - name: Lint web source
        id: frontend-lint
        if: contains(fromJSON('["full","selective","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" frontend-lint --cwd src/frontend -- pnpm web:lint
      - name: Repository Imports
        id: repository-imports
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" repository-imports -- uv run --no-sync python scripts/repository-boundary/check-python-imports.py
      - name: Check repository dependency boundaries
        id: repository-dependencies
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" repository-dependencies -- uv run --no-sync python scripts/check-repository-dependencies.py
      - name: Verify materialized LFS inputs
        id: lfs-integrity
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" lfs-integrity -- git lfs fsck
      # Types and generated SDK freshness.
      - name: Check backend and test types
        id: backend-types
        if: contains(fromJSON('["full","selective","backend-only","backend"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" backend-types -- uv run --no-sync mypy src/backend/animama tests --exclude web-ui --exclude deprecated --exclude templates
      - name: Check web types
        id: frontend-types
        if: contains(fromJSON('["full","selective","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" frontend-types --cwd src/frontend -- pnpm --filter animama-web check:source
      - name: Check desktop types
        id: desktop-types
        if: contains(fromJSON('["full","selective","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" desktop-types --cwd src/frontend -- pnpm desktop:check
      - name: Check shared package types
        id: packages-types
        if: contains(fromJSON('["full","selective","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" packages-types --cwd src/frontend -- pnpm packages:check
      - name: Check browser harness types
        id: harness-types
        if: contains(fromJSON('["full","selective","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" harness-types --cwd src/frontend -- pnpm e2e:check:source
      - name: Check generated SDK freshness
        id: sdk-freshness
        if: contains(fromJSON('["full","selective","backend-only","frontend-only","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" sdk-freshness --cwd src/frontend -- pnpm openapi-ts:check
      # Tests: lightweight profiles have explicit, bounded test selections.
      - name: Run documentation and source boundary guards
        id: docs-tests
        if: steps.select.outputs.mode == 'docs'
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" docs-tests -- uv run --no-sync pytest -q tests/test_generate_synthetic_docs.py tests/test_accountless_repository_boundaries.py
      - name: Run accountless source boundary guards
        id: accountless-guards
        if: contains(fromJSON('["frontend-only","backend","web"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" accountless-guards -- uv run --no-sync pytest -q tests/test_accountless_repository_boundaries.py
      - name: Run the complete offline backend suite
        id: backend-tests
        if: contains(fromJSON('["full","selective","backend-only"]'), steps.select.outputs.mode)
        env:
          PYTEST_ADDOPTS: --junitxml=${{ runner.temp }}/backend-pytest.xml
        run: |
          # Two workers halve the suite on the two-CPU runner (see the shorten-full-validation ExecPlan).
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" backend-tests -- uv run --no-sync pytest -n 2
      - name: Run every nonempty CI and release tooling suite
        id: tooling-tests
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" tooling-tests -- uv run --no-sync python scripts/ci/tooling_tests.py
      - name: Install Chromium for full browser-dependent tests
        id: browser-install
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" browser-install --cwd src/frontend -- pnpm exec playwright install chromium
      - name: Reuse immutable verified speech model inputs
        id: speech-cache
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode) && !inputs.cold-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/animama-models
          key: speech-${{ hashFiles('models/parakeet-tdt-0.6b-v2/manifest.json', 'models/browser-speech/manifest.json') }}
      - name: Acquire and verify exact model inputs before local serving
        id: model-inputs
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        env:
          ANIMAMA_MODEL_ROOT: ${{ runner.temp }}/animama-models
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" model-inputs -- bash -e -o pipefail -c '
          python3 scripts/models/parakeet.py acquire --source upstream
          python3 scripts/models/parakeet.py verify
          python3 scripts/models/browser_speech.py acquire
          python3 scripts/models/browser_speech.py verify
          echo "ANIMAMA_MODEL_ROOT=$ANIMAMA_MODEL_ROOT" >> "$GITHUB_ENV"
          echo "ANIMAMA_BROWSER_MODEL_DIR=$(python3 scripts/models/browser_speech.py path)" >> "$GITHUB_ENV"
          echo "ANIMAMA_PARAKEET_MODEL_DIR=$(python3 scripts/models/parakeet.py path)" >> "$GITHUB_ENV"
          '
      - name: Run browser harness unit tests
        id: harness-unit
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" harness-unit --cwd src/frontend -- pnpm e2e:test:unit
      - name: Run source runner and E2E script tests
        id: harness-scripts
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" harness-scripts --cwd src/frontend -- bash -e -o pipefail -c 'node --test scripts/ci-source.test.mjs scripts/e2e/*.test.mjs'
      - name: Run generated SDK tooling tests
        id: sdk-tests
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" sdk-tests --cwd src/frontend -- node --test scripts/generate-openapi-client.test.mjs
      - name: Run shared package tests
        id: packages-tests
        if: contains(fromJSON('["full","selective","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" packages-tests --cwd src/frontend -- pnpm packages:test
      - name: Run web unit and tooling tests
        id: web-tests
        if: contains(fromJSON('["full","selective","frontend-only"]'), steps.select.outputs.mode)
        env:
          # Vitest defaults to CPUs - 1 (one worker on this runner); two measured 26% faster.
          VITEST_MAX_WORKERS: "2"
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" web-tests --cwd src/frontend -- pnpm --filter animama-web test:source:unit
      - name: Run the selected browser test groups
        id: browser-tests
        if: contains(fromJSON('["full","selective","frontend-only"]'), steps.select.outputs.mode)
        env:
          BROWSER_GROUPS: ${{ steps.select.outputs.browser-groups }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" browser-tests -- python3 scripts/ci/browser_tests.py --groups "$BROWSER_GROUPS" --output "$RUNNER_TEMP/browser-tests"
      - name: Run desktop tests
        id: desktop-tests
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" desktop-tests --cwd src/frontend -- pnpm desktop:test
      # Build and rendered browser acceptance.
      - name: Build the production web app
        id: web-build
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" web-build --cwd src/frontend -- pnpm --filter animama-web build:source
      - name: Verify loaded accountless Library in both serving modes
        id: browser-smoke
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" browser-smoke -- uv run --no-sync python src/frontend/scripts/e2e/run-accountless-smoke.py --evidence "$RUNNER_TEMP/accountless-smoke"
      # Independent frozen producer and installed consumers remain separate.
      - name: Build packages and the whole hosted application from an independent snapshot
        id: package-build
        if: contains(fromJSON('["full","selective"]'), steps.select.outputs.mode) && steps.select.outputs.promotion == 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" package-build -- uv run --no-sync python scripts/package-sets/build.py build --source "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/public-artifacts"
      - name: Validate installed packages, Included seed and emitted application in isolation
        id: package-consumers
        if: contains(fromJSON('["full","selective"]'), steps.select.outputs.mode) && steps.select.outputs.promotion == 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" package-consumers -- uv run --no-sync python scripts/package-sets/build.py validate "$RUNNER_TEMP/public-artifacts" --work-dir "$RUNNER_TEMP/public-consumer"
      - name: Validate Compose topology
        id: compose-check
        if: contains(fromJSON('["full","selective","backend-only","frontend-only"]'), steps.select.outputs.mode)
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" compose-check -- bash -e -o pipefail -c '
          bash -n reset.sh
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.development.yml config --quiet
          docker compose -f docker-compose.yml --profile "*" config --format json | uv run --no-sync python scripts/validate_local_compose.py
          docker compose -f docker-compose.yml -f docker-compose.development.yml --profile "*" config --format json | uv run --no-sync python scripts/validate_local_compose.py
          '
      - name: Reclaim completed dependency trees before rebuilding the baseline
        id: workspace-reclaim
        if: contains(fromJSON('["full","selective"]'), steps.select.outputs.mode) && steps.select.outputs.promotion == 'true'
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" workspace-reclaim -- bash -e -o pipefail -c '
          rm -rf -- "$GITHUB_WORKSPACE/src/frontend/node_modules" "$RUNNER_TEMP/public-consumer/frontend/node_modules" "$RUNNER_TEMP/public-consumer/backend/.venv" "$RUNNER_TEMP/public-consumer/application" "$RUNNER_TEMP/public-consumer/previous-application" "$RUNNER_TEMP/public-consumer/controlled-selection"
          df -h "$RUNNER_TEMP"
          '
      - name: Check out the exact compatibility baseline
        id: baseline-checkout
        if: contains(fromJSON('["full","selective"]'), steps.select.outputs.mode) && steps.select.outputs.promotion == 'true'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ steps.select.outputs.baseline }}
          path: .compatibility-base
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Compare the candidate against its exact baseline's retained or rebuilt set
        id: package-compat
        if: contains(fromJSON('["full","selective"]'), steps.select.outputs.mode) && steps.select.outputs.promotion == 'true'
        env:
          BASE_COMMIT: ${{ steps.select.outputs.baseline }}
          CI_READ_TOKEN: ${{ github.token }}
        run: |
          # Compare against the baseline's retained validated set when it verifies; otherwise rebuild it.
          python3 "$GITHUB_WORKSPACE/scripts/ci/check.py" package-compat -- uv run --no-sync python scripts/ci/baseline_set.py --baseline "$BASE_COMMIT" --checkout "$GITHUB_WORKSPACE/.compatibility-base" --candidate "$RUNNER_TEMP/public-artifacts" --work "$RUNNER_TEMP" --record "$RUNNER_TEMP/baseline-set.json"
      - name: Retain unpublished validated package outputs
        id: package-artifacts
        if: contains(fromJSON('["full","selective"]'), steps.select.outputs.mode) && steps.select.outputs.promotion == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: animama-set-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-artifacts/
          if-no-files-found: error
          retention-days: ${{ steps.select.outputs.retention }}
      - name: Evaluate every required step and check receipt
        id: gate
        if: always()
        env:
          CI_STEPS: ${{ toJSON(steps) }}
          CI_PLAN_PATH: ${{ runner.temp }}/selection.json
          CI_RESULTS_DIR: ${{ runner.temp }}/checks
          CI_PACKAGE_SET_DIR: ${{ runner.temp }}/public-artifacts
          CI_BASELINE_RECORD: ${{ runner.temp }}/baseline-set.json
          CI_BROWSER_RESULTS: ${{ runner.temp }}/browser-tests/results.json
          # Read-only step timings for the job summary.
          CI_READ_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/validation.py gate --output "$RUNNER_TEMP/validation.json"
      - name: Retain success and failure diagnostics
        id: diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/checks/**/*.log
            ${{ runner.temp }}/backend-pytest.xml
            ${{ runner.temp }}/accountless-smoke/
            ${{ runner.temp }}/browser-tests/
            ${{ runner.temp }}/public-consumer/summary.json
            ${{ runner.temp }}/public-consumer/logs/
            ${{ runner.temp }}/public-consumer/frontend/*.png
            ${{ runner.temp }}/public-consumer/frontend/hosted-app/*.png
            ${{ runner.temp }}/public-consumer/frontend/hosted-app/whole-app-*.json
            ${{ runner.temp }}/public-consumer/frontend/hosted-app/clip-compatibility-failure.json
          retention-days: ${{ job.status != 'success' && 14 || steps.select.outputs.retention || 14 }}
      - name: Retain compact source-bound acceptance receipts
        id: receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/selection.json
            ${{ runner.temp }}/validation.json
            ${{ runner.temp }}/checks/**/*.json
          if-no-files-found: error
          retention-days: 14
