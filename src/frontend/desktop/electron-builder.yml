appId: com.animama.desktop
productName: Animama
copyright: Copyright (c) 2026 Raymond Van. AGPL-3.0-only; third-party terms apply.
directories:
  output: release
beforeBuild: ./scripts/before-build.mjs
electronDownload:
  cache: .electron-cache
files:
  - dist/**/*
  - package.json
  - from: ../../..
    to: .
    filter:
      - LICENSE
asarUnpack:
  - dist/native/*.node
# Every packed app carries this fuse wire; scripts/runtime/fuses.mjs checks it
# after packing. Fuses not named here keep Electron's defaults.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # An unsigned development pack needs a valid ad-hoc signature after the flip;
  # signed builds are signed afterwards anyway.
  resetAdHocDarwinSignature: true
extraMetadata:
  main: dist/main.js
# The static AppImage launcher needs no FUSE 2 library on the user's system,
# only the `fusermount` helper. electron-builder labels this toolset beta.
toolsets:
  appimage: "1.0.3"
# App icons come from the brand mark; regenerate them with `pnpm desktop:icons`.
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: animama
  # electron-builder would otherwise write `--no-sandbox` into the AppImage's
  # own desktop entry; the app refuses to run that way.
  executableArgs: []
  extraResources:
    - from: .desktop-runtime/linux-x64/runtime
      to: runtime
      filter:
        - "**/*"
    # The application-menu entry the app can add copies this icon.
    - from: build/icon.png
      to: icon.png
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  minimumSystemVersion: "15.0"
  defaultArch: arm64
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Animama uses the microphone for dictation and voice mode.
  extraResources:
    # Translated microphone prompts go into the lproj folders Electron already
    # ships (ja, ko, zh_CN, zh_TW), so the bundle gains no new localization.
    # English stays in extendInfo above.
    - from: build/locales
      to: .
      filter:
        - "*.lproj/InfoPlist.strings"
    # Each target packages exactly its own audited stage.
    - from: .desktop-runtime/darwin-arm64/runtime
      to: runtime
      filter:
        - "**/*"
win:
  icon: build/icon.ico
  defaultArch: x64
  artifactName: ${productName}-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker
  extraResources:
    - from: .desktop-runtime/win32-x64/runtime
      to: runtime
      filter:
        - "**/*"
# A one-click, per-user installer: %LOCALAPPDATA%\Programs\Animama, no UAC.
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  createStartMenuShortcut: true
  shortcutName: Animama
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
