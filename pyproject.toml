[project]
name = "animama-backend"
version = "0.3.0"
description = "Animama backend for an AI avatar companion app with direct model-client chat runtime."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Raymond Van" }]
dependencies = [
    "fastapi[standard]>=0.121",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10,<3",
    "typing-extensions>=4.12.2,<5",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "llama-index-core>=0.10.0",
    "aiofiles>=23.0.0",
    "debugpy>=1.8.17",
    "openai>=2.41.1,<3",
    "openai-agents>=0.18.0,<0.19.0",
    "anthropic>=1.12,<2",
    "google-genai>=2.25,<3",
    "pillow>=12.0.0,<13",
    "pypdf>=6.0.0,<7",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.59b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0",
    "opentelemetry-instrumentation-asyncpg>=0.59b0",
    "opentelemetry-instrumentation-psycopg>=0.59b0",
    "opentelemetry-instrumentation-logging>=0.59b0",
    "opentelemetry-instrumentation-system-metrics>=0.59b0",
    "psutil>=7.1.3",
    "elevenlabs>=2.39.0",
    "websockets>=15.0,<16",
    "watchfiles>=1.1,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/raymond-van/animama"
Documentation = "https://github.com/raymond-van/animama/tree/main/docs/backend"

[project.optional-dependencies]
server = ["gruut>=2.4.0"]
file-worker = [
    "docling==2.100.0",
    "torch>=2.2.2,<3",
    "torchvision>=0.17.2,<1",
]
voice = ["numpy>=2.2.0,<3"]
viz = ["graphviz>=0.17"]
realtime = []
encrypt = ["cryptography>=45.0,<46"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.uv]
conflicts = [
    [
        { extra = "server" },
        { extra = "file-worker" },
    ],
    [
        { group = "dev" },
        { extra = "file-worker" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
desktop-build = [
    "pyinstaller==6.22.2",
]
# Backend tests exercise the server runtime (gruut lip-sync phonemes), so the
# default development sync includes the server extra.
dev = [
    "animama-backend[server]",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.7.2",
    "rich>=13.0.0",
    "locust>=2.31.0",
    "ruff==0.9.2",
    "mypy>=1.11.0",
    "coverage>=7.6.12",
    "aiosqlite>=0.21.0",
    "python-docx>=1.2.0,<2",
    "reportlab>=4.4.0,<5",
    "vulture==2.16",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20260518",
    "types-reportlab>=4.4,<5",
    "pytest-xdist>=3.6",
]
examples = [
    "pynput",
    "types-pynput",
    "sounddevice",
    "textual",
    "websockets",
    "graphviz",
]


[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/animama"]

[tool.hatch.build.hooks.custom]
path = "src/backend/packaging/hatch_build.py"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["src/backend/animama/proposed_changes", "src/backend/animama/examples"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
isort = { combine-as-imports = true, known-first-party = ["animama"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E501"]
"scripts/consolidate_migrations.py" = ["E501"]
"alembic/**/*.py" = ["E402"]
"src/backend/animama/server/routers/agent.py" = ["B008"]
"src/backend/animama/server/routers/memory.py" = ["B008"]
"src/backend/animama/server/routers/block.py" = ["B008"]
"src/backend/animama/server/routers/anima.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
mypy_path = ["src/backend", "."]
explicit_package_bases = true
exclude = ["^src/backend/animama/proposed_changes", "^src/backend/animama/examples"]
plugins = ["pydantic.mypy"]

# The file-worker extra is checked at its adapter boundary without installing
# that heavyweight runtime pack into the development environment; gruut is untyped.
[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "gruut"]
ignore_missing_imports = true

# The optional system-metrics probe uses psutil's untyped distribution.
[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sounddevice.*"
ignore_missing_imports = true

[tool.coverage.run]
source = ["tests", "src/backend/animama"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"
exclude_also = [
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "logger.debug",
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.pydantic-mypy]
init_forbid_extra = true
warn_untyped_fields = true
