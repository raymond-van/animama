[project]
name = "animama-backend"
version = "0.3.0"
description = "Animama backend for an AI avatar companion app with direct model-client chat runtime."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
# The wheel carries code adapted from Letta (Apache-2.0) and the OpenAI Agents
# SDK (MIT); licenses/third-party/adapted-code.md names the files.
license-files = [
    "LICENSE",
    "licenses/third-party/adapted-code.md",
    "licenses/third-party/code-Apache-2.0.txt",
    "licenses/third-party/code-letta-LICENSE.txt",
    "licenses/third-party/code-openai-agents-LICENSE.txt",
]
authors = [{ name = "Raymond Van" }]
dependencies = [
    "fastapi[standard]>=0.141.1",
    # Imported directly; 1.3.1 is the first release without the known Starlette advisories.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "llama-index-core>=0.10.0",
    # Imported directly for chunk token counts; llama-index-core also requires it.
    "tiktoken>=0.12.0,<1",
    "openai>=3.39.0,<4",
    "openai-agents>=0.24.0,<0.25.0",
    "anthropic>=2.3.0,<3",
    # Both imported directly: the provider SDKs use httpx2 and no longer install httpx,
    # which the backend's own HTTP clients still use.
    "httpx>=0.28.1,<1",
    "httpx2>=2.16.0,<3",
    # ChatGPT plan sign-in: ID token validation and the desktop session file's AES-GCM encryption.
    "pyjwt[crypto]>=2.15.1,<3",
    "cryptography>=50.0,<51",
    "google-genai>=2.25,<3",
    "pillow>=13.0.0,<14",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-instrumentation-fastapi>=0.59b0",
    "opentelemetry-instrumentation-httpx>=0.59b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.59b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.59b0",
    "opentelemetry-instrumentation-asyncpg>=0.59b0",
    "opentelemetry-instrumentation-psycopg>=0.59b0",
    "opentelemetry-instrumentation-logging>=0.59b0",
    "opentelemetry-instrumentation-system-metrics>=0.59b0",
    "psutil>=7.1.3",
    "elevenlabs>=2.39.0",
    "websockets>=15.0,<16",
    "watchfiles>=1.1,<2",
    "regex>=2024.11.6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/raymond-van/animama"
Documentation = "https://github.com/raymond-van/animama/tree/main/docs/backend"

[project.optional-dependencies]
# Upload parsers, imported only by the parse child: Office documents, PDF text layers
# and safe XML. Every local composition installs them; the hosted one never parses uploads.
documents = [
    "python-docx>=1.2.0,<2",
    "python-pptx>=1.0.2,<2",
    "openpyxl>=3.1.5,<4",
    "pypdfium2>=5.14.0,<6",
    "defusedxml>=0.7.1,<1",
]
voice = ["numpy>=2.2.0,<3"]
# Empty, kept so existing `uv sync --extra viz --extra realtime` commands still resolve.
viz = []
realtime = []
# Empty in effect: cryptography is now a direct dependency. Kept so existing `--extra encrypt` commands resolve.
encrypt = ["cryptography>=50.0,<51"]

[tool.uv]
# Lock-only holds on releases that change the generated SDK or request behaviour;
# the published wheel keeps its broader ranges.
constraint-dependencies = [
    # 2.13+ merges identical Input/Output schemas, renaming generated SDK types.
    "pydantic<2.13",
    # 0.142+ adds native OpenTelemetry, and 0.147-0.162 change request parsing
    # (omitted vs null JSON values, form defaults); adopt them in their own change.
    "fastapi<0.142",
]

[dependency-groups]
desktop-build = [
    "pyinstaller==6.22.2",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.7.2",
    "locust>=2.31.0",
    "ruff==0.9.2",
    "mypy>=1.11.0",
    "coverage>=7.6.12",
    "debugpy>=1.8.17",
    "pypdf>=6.0.0,<7",
    "python-docx>=1.2.0,<2",
    "reportlab>=4.4.0,<5",
    "vulture==2.16",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20260518",
    "types-reportlab>=4.4,<5",
    "pytest-xdist>=3.6",
]


[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend/animama"]

[tool.hatch.build.hooks.custom]
path = "src/backend/packaging/hatch_build.py"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "TID252",
]
isort = { combine-as-imports = true, known-first-party = ["animama"] }
# Sibling imports (`from .x import y`) stay; anything reaching a parent package is absolute.
flake8-tidy-imports = { ban-relative-imports = "parents" }

[tool.ruff.lint.per-file-ignores]
"src/backend/migrations/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
mypy_path = ["src/backend", "."]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

# Backend code is fully annotated; only tests keep the relaxed definition rules above.
[[tool.mypy.overrides]]
module = ["animama.*"]
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true

# Upload parsers in the documents extra that ship no types; the parsers keep
# their calls to these libraries small and typed at their own boundary.
[[tool.mypy.overrides]]
module = ["defusedxml.*", "openpyxl.*", "pypdfium2.*"]
ignore_missing_imports = true

# Speech text drops emoji by Unicode property with regex, which ships no types.
[[tool.mypy.overrides]]
module = "regex"
ignore_missing_imports = true

# pgvector's SQLAlchemy column type ships no types.
[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

# The optional system-metrics probe uses psutil's untyped distribution.
[[tool.mypy.overrides]]
module = "psutil"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# No global fixture-loop override: each async fixture uses its own declared scope.
testpaths = ["tests"]
python_files = ["test_*.py", "integration_*.py"]
markers = [
    "allow_call_model_methods: explicitly permit real model implementations in opt-in tests",
]

[tool.coverage.run]
source = ["tests", "src/backend/animama"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"
exclude_also = [
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "logger.debug",
]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_untyped_fields = true
